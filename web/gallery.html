<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#030708">
<title>卡片图鉴 · 霓虹纪元</title><meta name="description" content="浏览霓虹纪元机械物种闪卡图鉴。选择一张卡片，进入可旋转、翻面的全息详情。"><link rel="stylesheet" href="./portal.css">
</head>
<body>
<header class="site-header"><a class="brand" href="./" aria-label="霓虹纪元首页"><span class="seal">NG</span><span>霓虹纪元<small>NEON GENESIS</small></span></a><span class="header-note">MECHANICAL LIFE ARCHIVE</span><a class="header-link" href="./gallery.html" aria-current="page">卡片图鉴 <span>↗</span></a></header>
<main class="gallery-main">
<nav class="breadcrumb" aria-label="当前位置"><a href="./">首页</a><span aria-hidden="true">/</span><span aria-current="page">卡片图鉴</span></nav>
<div class="gallery-heading"><div><p class="eyebrow">COLLECTION 01 / 霓虹纪元</p><h1>机械物种图鉴</h1><p>选择一张闪卡，走进它的世界。<br>转动、翻面，探索光与机械的另一种可能。</p></div><div class="card-count"><strong>10</strong>张已收录</div></div>
<section id="gallery-grid" class="gallery-grid" aria-label="全部闪卡"></section>
<p class="gallery-end">NEON GENESIS — MECHANICAL LIFE ARCHIVE</p>
</main>
<footer class="site-footer"><span>光随手动，画有余深。</span><span class="footer-en">DESIGNED TO BE SEEN IN MOTION</span></footer>
<script type="module">
import {catalog} from './catalog.js';
document.querySelector('#gallery-grid').innerHTML=catalog.map(card=>`<a class="specimen ${card.accent}" href="./card.html?card=${card.id}" aria-label="查看 No.${card.id} ${card.title}详情"><div class="specimen-art"><div class="card-window"><img src="./previews/${card.id}.png" width="1080" height="1500" alt="${card.title}全息闪卡缩略图"></div></div><div class="specimen-meta"><div><span class="specimen-number">No.${card.id} / ${card.habitat}</span><h2>${card.title}</h2><p>${card.habitatCn} · ${card.technique}</p></div><span class="open-card" aria-hidden="true">↗</span></div></a>`).join('');
</script>
</body>
</html>
